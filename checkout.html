<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Your Order</title>
    <link rel="stylesheet" href="checkout.css">
    <script src="checkout.js" defer></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="container">
        
        <a href="orderpage.html" class="back-link">&larr; Back to Order Page</a>

        <div class="checkout">
           
            <div class="left-section">
                <h1>CheckOut Your Order</h1>
                <form action="process_order.php" method="POST">
                    
                    <div class="section">
                        <h3>Delivery details</h3>
                        <div class="delivery-details">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" placeholder="Enter your name" style="margin-top: 20; width: 430;">
                        </div>
                        <div class="delivery-details">
                            <label for="address">Delivery Address:</label>
                            <input type="text" id="address" name="address" placeholder="Enter delivery address" style="margin-top: 20; width: 430;">
                        </div>
                        <div class="delivery-details">
                            <label for="email">Email:</label>
                            <input type="text" id="email" name="email" placeholder="Enter email" style="margin-top: 20; width: 430;">
                        </div>
                        <div class="delivery-details">
                            <label for="phone">Phone Number:</label>
                            <input type="text" id="phone" name="phone" placeholder="Enter phone number"  style="margin-top: 20; width: 430;">
                        </div>
                    </div>  
                        <h3>Special Instructions</h3>
                        <textarea name="special_instructions" id="special-instructions" cols="30" rows="10" placeholder="Enter any special instructions here" style="width: 600; font-family: k2d;"  aria-label="textarea"></textarea>

                    <button class="edit-btn">Edit</button>

                    <div class="section">
                        <h3>Payment</h3>
                        <div class="payment-method">
                            <label>
                                <input type="radio" name="payment_method" value="cash" checked> Cash
                            </label>
                            <label>
                                <input type="radio" name="payment_method" value="card"> Card
                            </label>
                        </div>

                        <div id="card-details" style="display: none;">
                            <label for="card-type">Card Type:</label>
                            <select name="card_type" id="card-type">
                                <option value="visa">Visa</option>
                                <option value="mastercard">MasterCard</option>
                                <option value="americanexpress">American Express</option>
                            </select>
                            <label for="card-holder-name">Card Holder's Name:</label>
                            <input type="text" id="card-holder-name" name="card_holder_name" placeholder="Enter card holder's name" required>

                            <label for="card-number">Card Number:</label>
                            <input type="text" id="card-number" name="card_number" placeholder="Enter card number" required maxlength="19" oninput="formatCardNumber(this)">


                            <label for="expiration-date">Expiration Date:</label>
                            <input type="month" id="expiration-date" name="expiration_date" required>

                            <label for="card-cvc">CVC (3 digit code):</label>
                            <input type="text" id="card-cvc" name="card_cvc" placeholder="Enter CVC" required>
                        </div>
                    </div>
                </form>
                <button class="place-order-btn" type="submit">Place order</button>
            </div>

            <!-- Right Section (Cart Summary) -->
            <div class="right-section">
                <div class="cart-summary">
                    <h3 id="cart-title">Cart summary</h3>

                    <div class="order-total">
                        <p>Subtotal <span class="amount" id="subtotal">LKR 0.00</span></p>
                        <p>Delivery Fee <span class="amount">LKR 99.00</span></p>
                        <p>Service Fee <span class="amount">LKR 112.75</span></p>
                        <hr>
                        <p class="total">Total <span class="final-total" id="final-total">LKR 0.00</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

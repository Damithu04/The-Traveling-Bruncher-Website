<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | The Traveling Bruncher</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Italiana&family=K2D:wght@200;400;600&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="Home.css">
    <link rel="stylesheet" href="menupage.css">
</head>

<body>

    <div id="loader">
        <div class="loader-content">
            <h2>Loading Menu...</h2>
            <div class="loading-bar"></div>
        </div>
    </div>

    <nav id="navbar">
        <div class="nav-container">
            <a href="Webtech.html" class="logo">
                <img src="Layer4.png" alt="TTB Logo">
            </a>

            <ul class="nav-links">
                <li><a href="Webtech.html">Home</a></li>
                <li><a href="#location">Find Us</a></li>

                <li>
                    <a href="#" onclick="toggleCart()" class="cart-icon-btn">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span id="cart-count">0</span>
                    </a>
                </li>

                <li><a href="checkout.html" class="btn-order">Proceed to Checkout</a></li>
            </ul>
        </div>
    </nav>

    <header class="page-header">
        <h1 class="main-title">Order Now</h1>
        <p class="subtitle">Fresh • Bold • Delicious</p>
    </header>

    <div class="menu-layout container">
        <aside class="menu-sidebar">
            <ul id="category-nav">
            </ul>
        </aside>

        <main id="menu-container">
        </main>
    </div>

    <div id="cart-modal" class="cart-modal-overlay">
        <div class="cart-modal-content">
            <div class="cart-header">
                <h2>Your Cart</h2>
                <span class="close-cart" onclick="toggleCart()">&times;</span>
            </div>

            <ul id="cart-items-list">
                <p class="empty-msg">Your cart is empty.</p>
            </ul>

            <div class="cart-footer-area">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cart-total-price">0 LKR</span>
                </div>
                <a href="checkout.html" class="btn-checkout-modal">Checkout</a>
            </div>
        </div>
    </div>

    <div id="toast">Item added to cart!</div>

    <footer id="location">
        <div class="container grid-footer">
            <div class="footer-info">
                <h3>Visit Us</h3>
                <p>6/46 Green Lanka Towers,<br>Nawam Mawatha, Colombo</p>
            </div>
            <div class="copyright">
                <p>© 2025 The Traveling Bruncher.</p>
            </div>
        </div>
    </footer>

    <script src="loadmenu.js"></script>
    <script src="menu.js"></script>
</body>

</html>
